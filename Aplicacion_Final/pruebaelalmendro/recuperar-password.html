<!DOCTYPE html>
<html lang="es" data-auth-recovery="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>El Almendro | Recuperar contraseña</title>
  <link rel="icon" type="image/x-icon" href="./favicon-el-almendro.ico?v=web01b">
  <script>
    // Capturar el enlace una sola vez y limpiar la URL antes de cargar recursos.
    window.hotelRecoveryLink = { hash: location.hash, search: location.search };
    history.replaceState(null, '', location.pathname);
    try { if ((localStorage.getItem('hotel_theme') || 'dark') === 'dark') document.documentElement.classList.add('dark'); } catch (_) {}
  </script>
  <link rel="stylesheet" href="./css/tailwind.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/ui-system.css">
</head>
<body class="alm-ui alm-auth min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">
  <main class="alm-panel alm-auth-card alm-auth-shell relative w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5">
    <div class="flex justify-between items-center gap-3"><span class="alm-brand-mark flex items-center justify-center w-12 h-12 rounded-2xl text-2xl" aria-hidden="true">🌳</span><button type="button" onclick="document.documentElement.classList.toggle('dark')" aria-label="Alternar modo claro y oscuro" class="alm-auth-theme p-2 rounded-lg border border-slate-300 dark:border-slate-700">☀ / ☾</button></div>
    <p class="alm-eyebrow text-xs font-bold">HOTEL EL ALMENDRO</p>
    <h1 class="alm-title text-2xl font-black">Establecer nueva contraseña</h1>
    <p id="recovery-message" role="status" aria-live="polite" class="text-sm text-slate-600 dark:text-slate-300">Verificando enlace de recuperación…</p>
    <form id="recovery-form" class="hidden space-y-4" onsubmit="guardarPasswordRecuperada(event)">
      <label for="recovery-password" class="block text-sm font-bold">Nueva contraseña</label>
      <div class="relative">
        <input id="recovery-password" type="password" autocomplete="new-password" minlength="6" required disabled class="alm-field w-full pl-3 pr-12 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        <button id="recovery-password-eye" type="button" onclick="alternarPasswordRecuperada('recovery-password')" aria-controls="recovery-password" aria-label="Mostrar nueva contraseña" aria-pressed="false" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 focus-visible:ring-2 focus-visible:ring-blue-500"></button>
      </div>
      <label for="recovery-confirm" class="block text-sm font-bold">Confirmar nueva contraseña</label>
      <div class="relative">
        <input id="recovery-confirm" type="password" autocomplete="new-password" required disabled class="alm-field w-full pl-3 pr-12 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        <button id="recovery-confirm-eye" type="button" onclick="alternarPasswordRecuperada('recovery-confirm')" aria-controls="recovery-confirm" aria-label="Mostrar confirmación de nueva contraseña" aria-pressed="false" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 focus-visible:ring-2 focus-visible:ring-blue-500"></button>
      </div>
      <button id="recovery-save" type="submit" disabled class="alm-btn-primary w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold disabled:opacity-50">Guardar nueva contraseña</button>
    </form>
    <button id="recovery-back" type="button" onclick="volverLoginRecuperacion()" class="w-full py-2 text-blue-600 dark:text-blue-400 font-bold disabled:opacity-50">Volver al inicio de sesión</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script>
  <script src="./js/config/supabaseClient.js"></script>
  <script src="./js/recuperarPassword.js"></script>
</body>
</html>
